name: AI Auto Search (Scheduled)

on:
  schedule:
    # 每天北京时间 8:00 (UTC 0:00) 和 20:00 (UTC 12:00)
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:  # 允许手动触发
    inputs:
      triggered_from:
        description: '触发来源'
        required: false
        default: 'manual'

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}

jobs:
  ai-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Debug - Show current time
        run: |
          echo "UTC Time: $(date -u)"
          echo "Beijing Time: $(TZ='Asia/Shanghai' date)"
          echo "Checking environment variables..."
          echo "SUPABASE_URL set: ${{ env.SUPABASE_URL != '' }}"
          echo "SUPABASE_SERVICE_ROLE_KEY set: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}"
          echo "KIMI_API_KEY set: ${{ env.KIMI_API_KEY != '' }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run AI Search
        run: python .github/scripts/ai_search.py

      - name: Report status
        if: always()
        run: echo "AI Search completed at $(TZ='Asia/Shanghai' date)"
