name: AI Auto Search (Scheduled)

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '15 1 * * *'
    - cron: '30 1 * * *'
    - cron: '0 13 * * *'
    - cron: '15 13 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      triggered_from:
        description: '触发来源'
        required: false
        default: 'manual'
      force_run:
        description: '强制运行（忽略今日已运行检查）'
        required: false
        default: 'false'

concurrency:
  group: ai-auto-search
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
  DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}

jobs:
  ai-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Debug - Show current time
        run: |
          echo "UTC Time: $(date -u)"
          echo "Beijing Time: $(TZ='Asia/Shanghai' date)"
          echo "Checking environment variables..."
          echo "SUPABASE_URL set: ${{ env.SUPABASE_URL != '' }}"
          echo "SUPABASE_SERVICE_ROLE_KEY set: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}"
          echo "KIMI_API_KEY set: ${{ env.KIMI_API_KEY != '' }}"
          echo "DASHSCOPE_API_KEY set: ${{ env.DASHSCOPE_API_KEY != '' }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run AI Search
        run: python .github/scripts/ai_search.py
        env:
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}

      - name: Report status
        if: always()
        run: echo "AI Search completed at $(TZ='Asia/Shanghai' date)"
