name: Regenerate Summaries

on:
  workflow_dispatch:  # 手动触发
    inputs:
      domain:
        description: '指定领域（留空=全部）'
        required: false
        default: 'economy'
        type: choice
        options:
          - ''
          - 'economy'
          - 'politics'
          - 'culture'
          - 'society'
          - 'ecology'
          - 'party'
          - 'defense'
          - 'diplomacy'
      limit:
        description: '处理文章数量限制（0=全部）'
        required: false
        default: '0'

# 并发控制：同一时间只允许一个实例运行，新实例会取消旧的
concurrency:
  group: regenerate-summaries
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
  KIMI_API_KEY_2: ${{ secrets.KIMI_API_KEY_2 }}
  KIMI_API_KEY_3: ${{ secrets.KIMI_API_KEY_3 }}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5小时超时
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Debug - Show current time and settings
        run: |
          echo "UTC Time: $(date -u)"
          echo "Beijing Time: $(TZ='Asia/Shanghai' date)"
          echo "Domain filter: ${{ inputs.domain }}"
          echo "Checking environment variables..."
          echo "SUPABASE_URL set: ${{ env.SUPABASE_URL != '' }}"
          echo "SUPABASE_SERVICE_ROLE_KEY set: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}"
          echo "KIMI_API_KEY set: ${{ env.KIMI_API_KEY != '' }}"
          echo "KIMI_API_KEY_2 set: ${{ env.KIMI_API_KEY_2 != '' }}"
          echo "KIMI_API_KEY_3 set: ${{ env.KIMI_API_KEY_3 != '' }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run regeneration script
        run: python .github/scripts/regenerate_summaries.py
        env:
          DOMAIN_FILTER: ${{ inputs.domain }}

      - name: Report completion
        if: always()
        run: echo "Regeneration completed at $(TZ='Asia/Shanghai' date)"