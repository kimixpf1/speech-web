name: Regenerate Summaries

on:
  workflow_dispatch:  # 手动触发
    inputs:
      limit:
        description: '处理文章数量限制（0=全部）'
        required: false
        default: '0'

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5小时超时
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Debug - Show current time
        run: |
          echo "UTC Time: $(date -u)"
          echo "Beijing Time: $(TZ='Asia/Shanghai' date)"
          echo "Checking environment variables..."
          echo "SUPABASE_URL set: ${{ env.SUPABASE_URL != '' }}"
          echo "SUPABASE_SERVICE_ROLE_KEY set: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}"
          echo "KIMI_API_KEY set: ${{ env.KIMI_API_KEY != '' }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run regeneration script
        run: python .github/scripts/regenerate_summaries.py

      - name: Report completion
        if: always()
        run: echo "Regeneration completed at $(TZ='Asia/Shanghai' date)"